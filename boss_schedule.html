<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오딘 길드 보스 스케줄</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("uiTheme") || "dark";
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css?v=15">
  <script>
    if (!localStorage.getItem('token') && !sessionStorage.getItem('token')) {
      window.location.href = 'login.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="api-config.js"></script>
  <script src="deputy-ui.js"></script>
  <script src="nav.js"></script>
</head>

<body>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-group">
          <h2>보스 입력 (공유됨)</h2>
        </div>
        <button id="sidebar-close" class="close-btn" aria-label="Close Sidebar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="input-mode-tabs" role="tablist" aria-label="보스 입력 방식">
        <button class="input-mode-tab active" id="direct-input-tab" type="button" role="tab" aria-selected="true" aria-controls="direct-input-panel">
          직접 입력
        </button>
        <button class="input-mode-tab" id="screenshot-input-tab" type="button" role="tab" aria-selected="false" aria-controls="screenshot-input-panel">
          스크린샷
        </button>
      </div>

      <section class="direct-input-panel" id="direct-input-panel" role="tabpanel" aria-labelledby="direct-input-tab">
        <div class="sidebar-content" id="form-container" style="padding-top: 0;">
          <!-- Accordion items injected via JS -->
        </div>
        <div class="sidebar-footer">
          <button id="apply-all-btn" class="primary-btn">전체 적용하기</button>
          <button id="clear-btn" class="clear-all-btn" type="button">공유 시간표 전체 초기화</button>
        </div>
      </section>

      <section class="sidebar-content screenshot-input-panel" id="screenshot-input-panel" role="tabpanel" aria-labelledby="screenshot-input-tab" hidden>
        <div class="screenshot-intro">
          <span class="screenshot-icon" aria-hidden="true">▣</span>
          <div>
            <strong>보스 시간표 스크린샷</strong>
            <p>시간표가 모두 보이도록 찍은 이미지를 올려주세요.</p>
          </div>
        </div>

        <label class="screenshot-dropzone" id="screenshot-dropzone" for="screenshot-file-input">
          <input id="screenshot-file-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <span class="screenshot-upload-icon" aria-hidden="true">↑</span>
          <strong>스크린샷 선택</strong>
          <span>또는 여기에 파일을 끌어다 놓으세요</span>
        </label>

        <div class="screenshot-preview" id="screenshot-preview" hidden>
          <img id="screenshot-preview-image" alt="선택한 보스 시간표 스크린샷 미리보기">
          <div class="screenshot-preview-meta">
            <span id="screenshot-file-name"></span>
            <span id="screenshot-image-size"></span>
          </div>
          <button type="button" class="screenshot-remove-btn" id="screenshot-remove-btn">다른 이미지 선택</button>
        </div>

        <div class="ocr-template-selector">
          <label for="ocr-template-select">스크린샷 템플릿</label>
          <select id="ocr-template-select" required disabled>
            <option value="">템플릿 목록을 불러오는 중…</option>
          </select>
        </div>
        <p class="screenshot-notice" id="screenshot-status">이미지는 이 기기에서 OCR 권장 크기로 최적화됩니다.</p>
        <button type="button" class="primary-btn screenshot-analyze-btn" id="screenshot-analyze-btn" disabled>스크린샷 분석하기</button>
        <div class="ocr-result-panel" id="ocr-result-panel" hidden>
          <strong>인식 결과</strong>
          <p>등록 전 결과를 확인해주세요.</p>
          <div class="ocr-result-list" id="ocr-result-list"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="wrap">
        <header class="sched-head">
          <div>
            <h1 id="main-guild-title">보스 스케줄</h1>
            <p class="sub">공유 스케줄 · 자동 동기화</p>
          </div>
          <div class="sched-clock">
            <span class="main-clock-label">서버 시간</span>
            <span id="current-time-display" class="main-clock-time">--:--:--</span>
          </div>
        </header>
        <div id="stats-container" hidden></div>

        <section class="card">
          <div class="toolbar">
            <div class="render-filters" id="render-filters" role="group" aria-label="보스 구분 필터">
              <label class="filter-chip"><input type="checkbox" class="render-filter-chk" value="공통" checked><span>공통</span><b class="filter-count" data-count-for="공통">0</b></label>
              <label class="filter-chip"><input type="checkbox" class="render-filter-chk" value="본섭" checked><span>본섭</span><b class="filter-count" data-count-for="본섭">0</b></label>
              <label class="filter-chip"><input type="checkbox" class="render-filter-chk" value="침공" checked><span>침공</span><b class="filter-count" data-count-for="침공">0</b></label>
              <label class="filter-chip"><input type="checkbox" class="render-filter-chk" value="고정" checked><span>고정</span><b class="filter-count" data-count-for="고정">0</b></label>
            </div>

            <div class="toolbar-actions">
              <div class="voice-toggle-wrapper">
                <label class="switch switch-sm">
                  <input type="checkbox" id="voice-toggle" checked aria-label="웹 음성 알림">
                  <span class="slider"></span>
                </label>
                <span>음성 알림</span>
              </div>
              <button id="voice-test-btn" class="action-btn icon-btn" type="button" title="음성 테스트" aria-label="음성 테스트">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              </button>
              <button id="toggle-view-btn" class="action-btn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
                간략히 보기
              </button>
              <button id="refresh-btn" class="action-btn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                동기화
              </button>
              <button id="sidebar-toggle" class="action-btn primary-action panel-toggle-btn" type="button" aria-controls="sidebar" aria-expanded="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
                입력 패널
              </button>
            </div>
          </div>

          <div class="list" id="schedule-container">
            <!-- Dynamically populated by app.js -->
            <div class="empty-state">
              데이터를 불러오는 중...
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>


  <!-- Participant List Modal -->
  <div id="participantModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; align-content: center; backdrop-filter: blur(4px);">
    <div class="modal-content" style="background: var(--panel-strong, #F7F2E9); border-radius: 16px; width: 90%; max-width: 400px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
      <div class="modal-header" style="padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: rgba(255,255,255,0.02);">
        <div>
          <h2 id="participantModalTitle" style="margin: 0; font-size: 18px; font-weight: 800; color: var(--text-light);">보스명 참여 목록</h2>
          <div id="participantCount" style="margin-top: 4px; font-size: 13px; color: var(--main); font-weight: 600;">총 0명</div>
        </div>
        <button onclick="document.getElementById('participantModal').style.display='none'" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 24px; padding: 4px; border-radius: 8px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="participantListContainer" style="padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--text-light); font-weight: 600;">
        <!-- Participants injected here -->
      </div>
    </div>
  </div>

  <script src="app.js?v=20"></script>
</body>

</html>
