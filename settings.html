<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오딘 보스 스케줄 - 설정</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem("uiTheme") || "dark";
    </script>
    <link rel="stylesheet" href="auth.css">
    <style>
        .auth-container { max-width: 980px; width: 96%; box-sizing: border-box; }
        .settings-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .settings-title h1 { margin: 0; font-size: 24px; }
        .settings-title p { margin: 6px 0 0; color: var(--text-muted); font-size: 13px; }
        .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .plain-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 8px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
        }
        .plain-btn:hover { background: rgba(255,255,255,0.08); }
        .settings-layout {
            display: grid;
            grid-template-columns: 210px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        .settings-tabs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
        }
        .settings-tab {
            text-align: left;
            border: 0;
            border-radius: 6px;
            padding: 11px 12px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 800;
        }
        .settings-tab.active {
            background: var(--primary-color);
            color: var(--text-light);
        }
        .settings-section {
            display: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background: rgba(255,255,255,0.04);
        }
        .settings-section.active { display: block; }
        .section-head { margin-bottom: 18px; }
        .section-head h2 { margin: 0; font-size: 18px; color: var(--primary-color); }
        .section-head p { margin: 6px 0 0; color: var(--text-muted); font-size: 13px; }
        .setting-item { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
        .setting-item label { font-size: 12px; color: var(--text-muted); font-weight: 800; }
        .setting-item input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(247, 242, 233, 0.72);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            padding: 11px 13px;
            font-size: 14px;
            outline: none;
        }
        :root[data-theme="dark"] .setting-item input { background: rgba(15, 23, 42, 0.6); }
        .setting-item input:focus { border-color: var(--primary-color); }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.04);
        }
        .toggle-row strong { display: block; font-size: 14px; }
        .toggle-row span { display: block; margin-top: 4px; color: var(--text-muted); font-size: 12px; line-height: 1.4; }
        .toggle-row.locked {
            opacity: 0.7;
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; flex: 0 0 auto; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch input:disabled + .slider {
            cursor: not-allowed;
            background-color: #6b7280;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #8D8373;
            transition: .25s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-light);
            transition: .25s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(26px); }
        .save-settings-btn {
            background: var(--primary-color);
            color: var(--text-light);
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .button-row .save-settings-btn { flex: 1; min-width: 160px; }
        .invite-link {
            margin-top: 14px;
            padding: 12px;
            background: rgba(0,0,0,0.18);
            border: 1px dashed var(--primary-color);
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .invite-link-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 800;
        }
        .copy-link-btn {
            flex: 0 0 auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: var(--text-light);
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }
        .copy-link-btn:hover { background: rgba(255,255,255,0.14); }
        .invite-url {
            display: block;
            font-family: monospace;
            word-break: break-all;
            line-height: 1.5;
        }
        .role-badge {
            background: rgba(242, 183, 5, 0.22);
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
        }
        :root[data-theme="dark"] .role-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }
        :root[data-theme="dark"] .settings-tab.active,
        :root[data-theme="dark"] .save-settings-btn {
            background: #6366f1;
        }
        :root:not([data-theme="dark"]) .settings-tab.active,
        :root:not([data-theme="dark"]) .save-settings-btn {
            color: #1A1714;
        }
        @media (max-width: 760px) {
            .settings-layout { grid-template-columns: 1fr; }
            .settings-tabs { flex-direction: row; overflow-x: auto; }
            .settings-tab { white-space: nowrap; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="settings-topbar">
            <div class="settings-title">
                <h1>길드 설정 <span id="userRoleBadge" class="role-badge">--</span></h1>
                <p>길드장/운영진 전용 설정을 항목별로 관리합니다.</p>
            </div>
            <div class="top-actions">
                <button class="plain-btn" type="button" onclick="window.location.href='menu.html'">메뉴로</button>
                <button class="plain-btn" type="button" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="settings-layout">
            <nav class="settings-tabs" aria-label="설정 분류">
                <button class="settings-tab active" type="button" data-section="guild">길드 설정</button>
                <button class="settings-tab" type="button" data-section="discord">디스코드</button>
                <button class="settings-tab" type="button" data-section="invites">가입 링크</button>
            </nav>

            <main>
                <section id="section-guild" class="settings-section active">
                    <div class="section-head">
                        <h2>길드 설정</h2>
                        <p>길드 이름과 길드원이 직접 수정할 수 있는 정보 범위를 관리합니다.</p>
                    </div>
                    <div class="setting-item">
                        <label for="guildNameInput">길드 이름</label>
                        <input type="text" id="guildNameInput" placeholder="오딘 길드">
                    </div>
                    <div class="toggle-row" id="combatPowerToggleRow">
                        <div>
                            <strong>길드원 전투력 수정 가능</strong>
                            <span id="combatPowerToggleHint">OFF일 경우 정보수정 화면에서 전투력 입력이 잠기고, 서버에서도 기존 전투력을 유지합니다.</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="allowCombatPowerEditInput" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button class="save-settings-btn" type="button" onclick="saveGuildSettings()">길드 설정 저장</button>
                </section>

                <section id="section-discord" class="settings-section">
                    <div class="section-head">
                        <h2>디스코드</h2>
                        <p>보스 알림 전송에 사용하는 봇 연동 정보를 관리합니다.</p>
                    </div>
                    <div class="setting-item">
                        <label for="discordTokenInput">디스코드 봇 토큰</label>
                        <input type="password" id="discordTokenInput" placeholder="디스코드 개발자 포털의 토큰">
                    </div>
                    <div class="setting-item">
                        <label for="discordChannelIdInput">알림 전송 채널 ID</label>
                        <input type="text" id="discordChannelIdInput" placeholder="공지 사항을 보낼 채널 ID">
                    </div>
                    <div class="toggle-row">
                        <div>
                            <strong>디스코드 메시지 알림 전송</strong>
                            <span>OFF일 경우 봇 설정은 보관하되 알림 전송을 중지합니다.</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="discordEnabledInput" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="button-row">
                        <button class="save-settings-btn" type="button" onclick="saveGuildSettings()">디스코드 설정 저장</button>
                        <button class="save-settings-btn" type="button" style="background:#7D7468;" onclick="testDiscord()">테스트 알림</button>
                    </div>
                </section>

                <section id="section-invites" class="settings-section">
                    <div class="section-head">
                        <h2>가입 링크</h2>
                        <p>일반 길드원 또는 운영진 가입 링크를 생성합니다.</p>
                    </div>
                    <div class="button-row">
                        <button class="save-settings-btn" type="button" onclick="generateInvite('MEMBER')">일반 가입 링크 생성</button>
                        <button class="save-settings-btn" type="button" onclick="generateInvite('ADMIN')">운영진 가입 링크 생성</button>
                    </div>
                    <div id="inviteLink" class="invite-link"></div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const role = localStorage.getItem('role') || sessionStorage.getItem('role');
        const roleLabels = { MASTER: '길드장', ADMIN: '운영진', MEMBER: '길드원' };
        const isMaster = role === 'MASTER';
        let currentSettings = {
            guild_name: '오딘 길드',
            discord_token: '',
            discord_channel_id: '',
            discord_enabled: 1,
            allow_member_combat_power_edit: 1
        };

        function handleAuthError() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            localStorage.removeItem('nickname');
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        if (!token) handleAuthError();
        if (role !== 'MASTER' && role !== 'ADMIN') {
            alert('길드장/운영진 전용 메뉴입니다.');
            window.location.href = 'menu.html';
        }

        document.getElementById('userRoleBadge').textContent = roleLabels[role] || role;

        function syncCombatPowerTogglePermission() {
            const toggle = document.getElementById('allowCombatPowerEditInput');
            const row = document.getElementById('combatPowerToggleRow');
            const hint = document.getElementById('combatPowerToggleHint');
            toggle.disabled = !isMaster;
            row.classList.toggle('locked', !isMaster);
            hint.textContent = isMaster
                ? 'OFF일 경우 정보수정 화면에서 전투력 입력이 잠기고, 서버에서도 기존 전투력을 유지합니다.'
                : '이 설정은 길드장만 변경할 수 있습니다. 운영진은 현재 상태만 확인할 수 있습니다.';
        }

        document.querySelectorAll('.settings-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.settings-tab').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.settings-section').forEach(section => section.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`section-${tab.dataset.section}`).classList.add('active');
            });
        });

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings', { headers: { Authorization: `Bearer ${token}` } });
                if (res.status === 401) return handleAuthError();
                currentSettings = { ...currentSettings, ...await res.json() };
                document.getElementById('guildNameInput').value = currentSettings.guild_name || '';
                document.getElementById('discordTokenInput').value = currentSettings.discord_token || '';
                document.getElementById('discordChannelIdInput').value = currentSettings.discord_channel_id || '';
                document.getElementById('discordEnabledInput').checked = currentSettings.discord_enabled !== 0;
                document.getElementById('allowCombatPowerEditInput').checked = currentSettings.allow_member_combat_power_edit !== 0;
                syncCombatPowerTogglePermission();
                if (currentSettings.guild_name) document.title = `${currentSettings.guild_name} - 설정`;
            } catch (err) {
                alert('설정을 불러오지 못했습니다.');
            }
        }

        async function saveGuildSettings() {
            if (role !== 'MASTER' && role !== 'ADMIN') return;
            const body = {
                guild_name: document.getElementById('guildNameInput').value,
                discord_token: document.getElementById('discordTokenInput').value,
                discord_channel_id: document.getElementById('discordChannelIdInput').value,
                discord_enabled: document.getElementById('discordEnabledInput').checked ? 1 : 0,
                allow_member_combat_power_edit: document.getElementById('allowCombatPowerEditInput').checked ? 1 : 0
            };

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });
                if (res.status === 401) return handleAuthError();
                if (!res.ok) return alert('저장에 실패했습니다.');
                currentSettings = { ...currentSettings, ...body };
                alert('설정이 저장되었습니다.');
            } catch (err) {
                alert('서버 통신 오류');
            }
        }

        async function testDiscord() {
            if (role !== 'MASTER' && role !== 'ADMIN') return;
            try {
                const res = await fetch('/api/test-discord', {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.status === 401) return handleAuthError();
                const data = await res.json();
                if (res.ok) {
                    alert('디스코드로 테스트 메시지를 보냈습니다! 채널을 확인하세요.');
                } else {
                    alert('테스트 실패: ' + data.error);
                }
            } catch (err) {
                alert('서버 통신 오류');
            }
        }

        async function generateInvite(targetRole = 'MEMBER') {
            try {
                const res = await fetch('/api/invites', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ targetRole })
                });

                if (res.status === 401 || res.status === 403) {
                    alert('세션이 만료되었거나 권한이 없습니다.');
                    handleAuthError();
                    return;
                }

                const data = await res.json();
                if (res.ok) {
                    const link = `${window.location.origin}/register.html?token=${data.inviteToken}`;
                    const inviteDiv = document.getElementById('inviteLink');
                    inviteDiv.style.display = 'block';
                    inviteDiv.dataset.link = link;
                    inviteDiv.innerHTML = `
                        <div class="invite-link-head">
                            <span>생성된 가입 링크</span>
                            <button class="copy-link-btn" type="button" onclick="copyInviteLink()">Copy</button>
                        </div>
                        <a class="invite-url" href="${link}" target="_blank" style="color: var(--primary-color);">${link}</a>
                    `;
                } else {
                    alert('오류: ' + data.error);
                }
            } catch (err) {
                alert('서버 통신 오류');
            }
        }

        async function copyInviteLink() {
            const inviteDiv = document.getElementById('inviteLink');
            const link = inviteDiv.dataset.link;
            if (!link) return;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(link);
                } else {
                    const tempInput = document.createElement('input');
                    tempInput.value = link;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    tempInput.remove();
                }
                const button = inviteDiv.querySelector('.copy-link-btn');
                button.textContent = 'Copied';
                setTimeout(() => { button.textContent = 'Copy'; }, 1400);
            } catch (err) {
                alert('복사에 실패했습니다. 링크를 직접 선택해서 복사해주세요.');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            localStorage.removeItem('username');
            localStorage.removeItem('userId');
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        syncCombatPowerTogglePermission();
        loadSettings();
    </script>
</body>
</html>
