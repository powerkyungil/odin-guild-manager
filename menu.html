<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>오딘 보스 스케줄 - 홈</title>
    <script>
    document.documentElement.dataset.theme = localStorage.getItem("uiTheme") || "dark";
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="auth.css">
    <style>
        body {
            display: block;
            min-height: 100vh;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }
        .home {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px max(16px, 3vw) 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
        }
        .home *, .home *::before, .home *::after { box-sizing: border-box; }
        .num { font-variant-numeric: tabular-nums; }

        .home-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .home-eyebrow { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
        .home-head h1 { margin: 4px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
        .home-head-side { display: flex; align-items: flex-end; gap: 14px; }
        .home-clock { text-align: right; }
        .home-clock span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
        .home-clock strong { font-size: 24px; font-weight: 800; color: var(--text); }
        .theme-select {
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            padding: 6px 10px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .theme-select:focus-visible { outline: none; box-shadow: var(--focus-ring); }

        .home-alert {
            padding: 10px 12px;
            border: 1px solid rgba(var(--danger-rgb), 0.35);
            border-radius: 8px;
            background: rgba(var(--danger-rgb), 0.08);
            color: var(--danger);
            font-size: 13px;
            font-weight: 700;
        }

        .home-hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; }
        .home-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .home-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        .hcard {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
        }
        .hcard-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
        .hcard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .hcard-head h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); }
        .hcard-link {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 4px;
            color: var(--main-ink);
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 6px;
        }
        .hcard-link:hover { text-decoration: underline; }
        .hcard-link:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .hcard-empty { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
        .hcard-retry {
            align-self: flex-start;
            min-height: 34px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 다음 보스 */
        .hcard.next {
            border-color: rgba(var(--main-rgb), 0.55);
            background: linear-gradient(135deg, rgba(var(--main-rgb), 0.16), transparent 65%), var(--panel);
        }
        .next-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; }
        .next-name { margin: 0; font-size: 28px; font-weight: 800; color: var(--text); overflow-wrap: anywhere; }
        .next-countdown { font-size: 36px; font-weight: 800; color: var(--main-ink); line-height: 1; }
        .next-meta { margin: 0; color: var(--muted); font-size: 14px; }
        .next-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
        .hbtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
        }
        .hbtn.primary { background: var(--main); border-color: var(--main); color: var(--on-main); }
        .hbtn:hover { border-color: var(--main); }
        .hbtn.primary:hover { background: var(--main-hover); }
        .hbtn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

        /* 배지 */
        .pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            background: var(--panel-strong);
            color: var(--muted);
            border: 1px solid var(--line);
        }
        .pill.main { background: var(--main-soft); color: var(--main-ink); border-color: rgba(var(--main-rgb), 0.35); }
        .pill.inv { background: var(--inv-soft); color: var(--inv); border-color: rgba(var(--inv-rgb), 0.35); }
        .pill.ok { background: rgba(var(--success-rgb), 0.14); color: var(--success); border-color: rgba(var(--success-rgb), 0.35); }
        .pill.bad { background: rgba(var(--danger-rgb), 0.12); color: var(--danger); border-color: rgba(var(--danger-rgb), 0.35); }

        /* 목록 */
        .hlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
        .hlist li {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 40px;
            padding: 8px 0;
            border-top: 1px solid var(--line);
            font-size: 14px;
            color: var(--text);
            min-width: 0;
        }
        .hlist li:first-child { border-top: 0; }
        .hlist .time { font-weight: 800; min-width: 46px; }
        .hlist .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hlist .aside { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }

        /* 투표 진행 */
        .vote-progress { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--text); }
        .vote-progress strong { font-size: 20px; }
        .bar { height: 8px; border-radius: 99px; background: var(--panel-strong); overflow: hidden; }
        .bar span { display: block; height: 100%; border-radius: inherit; background: var(--success); transition: width 0.3s; }

        .control-chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .skeleton { color: var(--muted); font-size: 14px; }

        @media (max-width: 960px) {
            .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 720px) {
            .home { padding-top: 20px; }
            .home-hero, .home-grid, .home-grid.two { grid-template-columns: 1fr; }
            .home-head { align-items: flex-start; }
            .home-head-side { width: 100%; justify-content: space-between; }
            .home-clock { text-align: left; }
            .next-name { font-size: 24px; }
            .next-countdown { font-size: 30px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bar span { transition: none; }
        }
    </style>
  <script src="api-config.js"></script>
  <script src="deputy-ui.js"></script>
  <script src="nav.js"></script>
</head>
<body>
    <main class="home" aria-labelledby="homeTitle">
        <header class="home-head">
            <div>
                <p class="home-eyebrow" id="homeDate">&nbsp;</p>
                <h1 id="homeTitle">홈</h1>
            </div>
            <div class="home-head-side">
                <div class="home-clock">
                    <span>서버 시간</span>
                    <strong class="num" id="homeClock">--:--:--</strong>
                </div>
                <select id="themeSelect" class="theme-select" aria-label="테마 선택">
                    <option value="safety">샌드골드</option>
                    <option value="dark">다크블루</option>
                </select>
            </div>
        </header>

        <div class="home-alert" id="homeAlert" role="alert" hidden></div>

        <section class="home-hero" aria-label="지금 할 일">
            <article class="hcard next" id="nextBossCard" aria-live="polite">
                <div class="hcard-head">
                    <h2>다음 보스</h2>
                    <span id="nextBossType"></span>
                </div>
                <div class="hcard-body" id="nextBossBody"><p class="skeleton">일정을 불러오는 중…</p></div>
            </article>

            <article class="hcard" id="voteCard">
                <div class="hcard-head">
                    <h2 id="voteCardTitle">오늘 내 투표</h2>
                    <a class="hcard-link" href="boss_vote.html">투표하기 →</a>
                </div>
                <div class="hcard-body" id="voteBody"><p class="skeleton">투표를 불러오는 중…</p></div>
            </article>
        </section>

        <section class="home-grid" id="homeGrid" aria-label="길드 소식">
            <article class="hcard" id="upcomingCard">
                <div class="hcard-head">
                    <h2>이후 일정</h2>
                    <a class="hcard-link" href="boss_schedule.html">전체 →</a>
                </div>
                <div class="hcard-body" id="upcomingBody"><p class="skeleton">일정을 불러오는 중…</p></div>
            </article>

            <article class="hcard" id="supportCard">
                <div class="hcard-head">
                    <h2>손지원</h2>
                    <a class="hcard-link" href="support.html">매칭 →</a>
                </div>
                <div class="hcard-body" id="supportBody"><p class="skeleton">요청을 불러오는 중…</p></div>
            </article>

            <article class="hcard" id="noticeCard" data-deputy-hidden="true">
                <div class="hcard-head">
                    <h2>공지 · 보스 통제</h2>
                    <a class="hcard-link" href="notice.html">전체 →</a>
                </div>
                <div class="hcard-body" id="noticeBody"><p class="skeleton">공지를 불러오는 중…</p></div>
            </article>
        </section>

        <footer style="display:flex; justify-content:center; gap:16px; margin-top:12px; font-size:13px;">
            <a href="/privacy" style="color:var(--text-muted);">개인정보처리방침</a>
            <a href="/delete-account" style="color:var(--text-muted);">계정 삭제</a>
        </footer>
    </main>

    <script src="home.js"></script>
</body>
</html>
