<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오딘 보스 스케줄 - 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
    document.documentElement.dataset.theme = localStorage.getItem("uiTheme") || "dark";
  </script>
  <link rel="stylesheet" href="auth.css">
  <script src="api-config.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Odin Boss Schedule</h1>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">계정에 로그인하세요</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="loginMode">로그인 유형</label>
                <select id="loginMode">
                    <option value="USER">일반 계정</option>
                    <option value="DEPUTY">부주 계정</option>
                </select>
                <small style="display:block; margin-top:7px; color:var(--text-muted);">부주 계정은 로그인 후 대신할 길드 캐릭터를 선택합니다.</small>
            </div>

            <div class="form-group"
                style="display: flex; gap: 15px; flex-direction: row; align-items: center; justify-content: flex-start; margin-top: 5px; margin-bottom: 20px;">
                <label
                    style="display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; color: var(--text-muted); font-size: 14px;">
                    <input type="checkbox" id="saveId"
                        style="width: 16px; height: 16px; margin: 0; accent-color: var(--primary-color);"> 아이디 저장
                </label>
                <label
                    style="display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; color: var(--text-muted); font-size: 14px;">
                    <input type="checkbox" id="autoLogin"
                        style="width: 16px; height: 16px; margin: 0; accent-color: var(--primary-color);" checked> 자동
                    로그인
                </label>
            </div>

            <button type="submit" class="auth-btn">로그인</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
        <div style="display:flex; justify-content:center; gap:16px; margin-top:20px; font-size:13px;">
            <a href="/privacy" style="color:var(--text-muted);">개인정보처리방침</a>
            <a href="/delete-account" style="color:var(--text-muted);">계정 삭제</a>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('savedUsername');
            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('saveId').checked = true;
            }

            // Check if already logged in
            if (localStorage.getItem('token') || sessionStorage.getItem('token')) {
                window.location.href = 'menu.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginMode = document.getElementById('loginMode').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                const endpoint = loginMode === 'DEPUTY' ? '/api/v1/deputy-auth/login' : '/api/v1/auth/login';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    const saveId = document.getElementById('saveId').checked;
                    const autoLogin = document.getElementById('autoLogin').checked;

                    if (saveId) {
                        localStorage.setItem('savedUsername', username);
                    } else {
                        localStorage.removeItem('savedUsername');
                    }

                    const storage = autoLogin ? localStorage : sessionStorage;
                    [
                        'token', 'role', 'principalType', 'accountType', 'username', 'userId',
                        'deputyId', 'guildId', 'nickname', 'activeCharacterKey', 'activeCharacter',
                        'voteTargetCharacterKey'
                    ].forEach(key => {
                        localStorage.removeItem(key);
                        sessionStorage.removeItem(key);
                    });
                    storage.setItem('token', data.token);
                    if (loginMode === 'DEPUTY') {
                        storage.setItem('role', 'DEPUTY');
                        storage.setItem('principalType', 'DEPUTY');
                        storage.setItem('accountType', 'DEPUTY');
                        storage.setItem('username', data.username);
                        storage.setItem('deputyId', data.deputyId);
                        storage.setItem('guildId', data.guildId);
                        if (data.nickname) storage.setItem('nickname', data.nickname);
                        if (data.activeCharacter) {
                            storage.setItem('activeCharacterKey', data.activeCharacter.characterKey);
                            storage.setItem('activeCharacter', JSON.stringify(data.activeCharacter));
                        }
                    } else {
                        storage.setItem('role', data.role);
                        storage.setItem('principalType', 'USER');
                        storage.setItem('accountType', 'USER');
                        storage.setItem('username', data.username);
                        storage.setItem('userId', data.userId);
                        if (data.nickname) storage.setItem('nickname', data.nickname);
                    }

                    window.location.href = 'menu.html';
                } else {
                    errorDiv.textContent = data.error || '로그인에 실패했습니다.';
                }
            } catch (err) {
                errorDiv.textContent = '서버 통신 오류가 발생했습니다.';
            }
        });
    </script>
</body>

</html>
