<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울 길드 - 임시 점검</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(circle at 20% 10%, rgba(99, 102, 241, .24), transparent 38%),
                radial-gradient(circle at 90% 90%, rgba(14, 165, 233, .18), transparent 35%),
                #0b1020;
        }
        .card {
            width: min(100%, 480px);
            padding: 38px 32px;
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 24px;
            background: rgba(15, 23, 42, .9);
            box-shadow: 0 28px 80px rgba(0, 0, 0, .38);
            text-align: center;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 999px;
            color: #c7d2fe;
            background: rgba(99, 102, 241, .16);
            font-size: 13px;
            font-weight: 700;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #818cf8;
            box-shadow: 0 0 16px #818cf8;
        }
        h1 { margin: 24px 0 12px; font-size: clamp(28px, 8vw, 38px); }
        .description { margin: 0; color: #a8b1c5; line-height: 1.7; }
        .login-toggle {
            margin-top: 30px;
            border: 0;
            color: #94a3b8;
            background: transparent;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        form { display: none; gap: 12px; margin-top: 20px; text-align: left; }
        form.visible { display: grid; }
        label { color: #cbd5e1; font-size: 13px; font-weight: 700; }
        input {
            width: 100%;
            margin-top: 7px;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #f8fafc;
            background: #111827;
            outline: none;
        }
        input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, .14); }
        .submit {
            margin-top: 4px;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            font-weight: 800;
            cursor: pointer;
        }
        .submit:disabled { opacity: .55; cursor: wait; }
        .message { min-height: 20px; margin: 2px 0 0; color: #fca5a5; font-size: 13px; text-align: center; }
    </style>
  <script src="api-config.js"></script>
</head>
<body>
    <main class="card">
        <div class="status"><span class="dot"></span>임시 점검 중</div>
        <h1>잠시만 기다려 주세요</h1>
        <p class="description">더 안정적인 서비스를 위해 시스템을 점검하고 있습니다.<br>점검이 끝나는 대로 정상적으로 이용하실 수 있습니다.</p>

        <p class="description">긴급한 문의는 길드 운영진에게 전달해 주세요.</p>
    </main>
</body>
</html>
